name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.1），留空则只构建不出包'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.424
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows win-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-win-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-win-
      - name: Publish single-file exe
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Runtime win-x64
      - name: Package zip
        shell: pwsh
        run: |
          $stage = 'artifacts/package/win-x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'artifacts/windows/win-x64/SnapTranslate.exe' $stage
          Copy-Item 'packaging/windows/使用说明.txt' "$stage/使用说明.txt"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $stage).Path,
            (Join-Path (Resolve-Path 'artifacts/package').Path 'SnapTranslate-win-x64.zip'),
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Get-Item 'artifacts/package/SnapTranslate-win-x64.zip' | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win-x64
          path: artifacts/package/SnapTranslate-win-x64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.rid }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            name: macos-arm64
          - rid: osx-x64
            name: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ matrix.rid }}-
      - name: Build universal Vision helper
        run: bash scripts/build-macos-helper.sh
      - name: Publish macOS client
        run: >-
          dotnet publish src/SnapTranslate.Desktop/SnapTranslate.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:UseAppHost=true -o artifacts/publish/${{ matrix.rid }}
      - name: Package application bundle
        run: bash scripts/package-macos.sh ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }}
      - name: Verify bundle signature and binaries
        run: >-
          test -x artifacts/macos/${{ matrix.rid }}/SnapTranslate.app/Contents/MacOS/SnapTranslate
          && test -x artifacts/macos/${{ matrix.rid }}/SnapTranslate.app/Contents/Resources/SnapTranslateVision
          && codesign --verify --deep --strict artifacts/macos/${{ matrix.rid }}/SnapTranslate.app
      - name: Rename artifact
        run: mv artifacts/macos/${{ matrix.rid }}/SnapTranslate-${{ matrix.rid }}.zip artifacts/SnapTranslate-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: artifacts/SnapTranslate-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show assets
        run: ls -lh dist
      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" dist/* --clobber \
            || gh release create "$TAG" dist/* --title "SnapTranslate $TAG" --generate-notes
