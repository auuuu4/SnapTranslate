name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 先描述问题，再描述想要的方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的实现方式
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 涉及界面改动
        - label: 涉及新增翻译通道
        - label: 涉及新增依赖
        - label: 我愿意提交 PR
